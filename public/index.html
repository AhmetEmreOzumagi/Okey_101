<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f3b28">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="101 Okey">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>101 Okey</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="boot"><div><div class="boot-mark"><span>1</span><span>0</span><span>1</span></div><div id="bootMsg">Masa kuruluyor…</div><button class="btn" id="bootReload" style="display:none" onclick="location.reload()">Sayfayı yenile</button></div></div>
<script>setTimeout(function(){var b=document.getElementById('boot');if(b&&b.style.display!=='none'){document.getElementById('bootMsg').textContent='Oyundan cevap bekleniyor. Bağlantı zayıfsa biraz sürebilir.';document.getElementById('bootReload').style.display='inline-block';}},7000);</script>

<div id="lobby" class="screen hidden">
  <div class="lwrap">
    <header class="lhead">
      <div class="lmark"><span class="mt c0">10</span><span class="mt c2">1</span></div>
      <div><h1>101 Okey</h1><p>Dört kişilik masa · eksik varsa bot oturur</p></div>
    </header>
    <form id="nameBar" class="namebar hidden" autocomplete="off">
      <label for="nameIn">Adın</label>
      <input id="nameIn" maxlength="14" placeholder="Adını yaz" enterkeyhint="done">
      <span class="nhint">sonra boş bir sandalyeye dokun</span>
    </form>
    <div class="lmain">
      <div id="ltable"></div>
      <div class="lside">
        <div id="lsettings"></div>
        <div id="ljoin"></div>
      </div>
    </div>
  </div>
</div>

<div id="game" class="screen hidden">
  <div id="felt">
    <div class="pile" id="pile-tl"></div>
    <div class="chip-top" id="opp-top"></div>
    <div class="pile" id="pile-tr"></div>
    <div class="chip-side" id="opp-left"></div>
    <div id="melds"></div>
    <div class="chip-side" id="opp-right"></div>
    <div class="pile" id="pile-bl"></div>
    <div id="mid"></div>
    <div class="pile" id="pile-br"></div>
    <button id="menuBtn" class="iconbtn" aria-label="Menü"><i></i><i></i><i></i></button>
  </div>
  <div id="tray">
    <div id="timebar"><i></i></div>
    <div id="rack"></div>
    <div id="actions"></div>
  </div>
</div>

<div id="overlay" class="hidden"></div>
<div id="modal" class="hidden"></div>
<div id="toast"></div>
<div id="conn" class="hidden">Bağlantı koptu, yeniden bağlanıyor…</div>
<div id="rotate"><div><div class="rot-icon"><span></span></div>Oynamak için telefonu yan çevirin<p class="rot-sub">Dönmüyorsa ekran döndürme kilidini kapatın (iPhone'da Denetim Merkezi'ndeki kilit simgesi).</p></div></div>
<div id="fx"></div>

<script src="engine.js"></script>
<script src="qr.js"></script>
<script src="app.js"></script>
</body>
</html>
